<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunno – Admin</title>
<style>
:root{--nv:#1b1a3a;--pu:#6d4aff;--bg:#f5f6fb;--cd:#fff;--tx:#1d1d2b;--mu:#6b6c80;--bd:#e6e7f0;--ok:#067647;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.hide{display:none!important}
.lgw{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--nv);padding:16px}
.lgc{background:#fff;border-radius:18px;padding:26px;width:100%;max-width:380px}
.logo{font-size:26px;font-weight:800;color:var(--pu)}
input,select{width:100%;padding:10px;margin-top:8px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff;color:var(--tx)}
.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--pu);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:14px}
.ok{background:#e7f6ee;color:var(--ok)}.er{background:#fdecea;color:var(--bad)}
#app{display:flex;min-height:100vh}
#sb{width:230px;background:var(--nv);color:#cfd0ee;padding:18px 12px;flex-shrink:0}
#sb .logo{color:#fff;padding:0 8px 18px}
#sb a{display:block;padding:10px 12px;border-radius:10px;color:#cfd0ee;cursor:pointer;margin-bottom:4px}
#sb a.on{background:var(--pu);color:#fff}
.mn{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#fff;border-bottom:1px solid var(--bd)}
.top b{font-size:18px;flex:1}.top #mb{display:none;border:0;background:none;font-size:22px}
main{padding:18px;max-width:980px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kp{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px}
.kp b{display:block;font-size:26px}.kp span{color:var(--mu);font-size:13px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 10px}
.rh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-size:12px;padding:2px 9px;border-radius:99px}
.tg-ok{background:#e7f6ee;color:var(--ok)}.tg-bad{background:#fdecea;color:var(--bad)}.tg-n{background:#eef;color:#4338ca}
.mut{color:var(--mu);font-size:13px;margin-top:6px}
.chip{display:inline-block;background:#eef;color:#4338ca;border-radius:99px;padding:2px 10px;margin:4px 6px 0 0;font-size:13px}
.chip i{font-style:normal;cursor:pointer;margin-left:6px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}.row input,.row select{margin-top:0}
.sbtn{padding:8px 12px;border:1px solid var(--bd);background:#fff;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
summary{cursor:pointer;color:var(--pu);margin-top:8px}
@media(max-width:800px){#sb{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:.2s}#sb.open{transform:none}.top #mb{display:block}}
</style>
</head>
<body>
<div id="lg" class="lgw"><div class="lgc"><div class="logo">★ Sunno</div><div class="mut">Innoxol Technologies</div>
<input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<button class="btn" id="lb">Login</button><div id="lm"></div></div></div>
<div id="app" class="hide">
<aside id="sb"><div class="logo">★ Sunno</div>
<a data-v="dash" class="on">Dashboard</a><a data-v="rest">Restaurants</a><a data-v="pack">Packages</a><a data-v="subs">Subscriptions</a><a data-v="pay">Payments</a><a data-v="aud">Audit log</a><a id="lo">Logout</a></aside>
<div class="mn"><div class="top"><button id="mb">☰</button><b id="pt">Dashboard</b><span class="mut" id="who"></span></div><main id="main"></main></div></div>
<script>
var URL_="https://janatzwnpkkktdjtijvg.supabase.co",KEY="sb_publishable_c0zs6fe0koMK3koP5lsvhw_et_UnE2a";
var TOK=null,V="dash",DATA=[],PK=[];
var ADD_USER_FN="swift-handler";
function $(i){return document.getElementById(i)}
function esc(t){var d=document.createElement("div");d.textContent=t==null?"":t;return d.innerHTML}
function H(){return {"apikey":KEY,"Authorization":"Bearer "+(TOK||KEY),"Content-Type":"application/json"}}
function J(x){if(!x.ok)throw new Error(x.status==401?"login":x.status);return x.json()}
function rpc(n,b){return fetch(URL_+"/rest/v1/rpc/"+n,{method:"POST",headers:H(),body:JSON.stringify(b||{})}).then(function(x){if(!x.ok)return x.json().then(function(j){throw new Error(j.message||x.status)});return x})}
function fn(n,b){return fetch(URL_+"/functions/v1/"+n,{method:"POST",headers:H(),body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){if(!r.ok||j.error)throw new Error(j.error||j.msg||j.message||r.status);return j})})}
function msg(id,t,ok){$(id).innerHTML='<div class="msg '+(ok?"ok":"er")+'">'+esc(t)+'</div>'}

$("lb").onclick=function(){
 var b=$("lb");b.disabled=true;$("lm").innerHTML="";
 fetch(URL_+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})})
 .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
 .then(function(x){if(!x.ok||!x.j.access_token)throw 0;TOK=x.j.access_token;$("pw").value="";$("who").textContent=x.j.user&&x.j.user.email||"";boot()})
 .catch(function(){msg("lm","Email ya password galat hai.")}).then(function(){b.disabled=false});
};
$("lo").onclick=function(){TOK=null;$("app").className="hide";$("lg").className="lgw"};
$("mb").onclick=function(){$("sb").classList.toggle("open")};

function boot(){
 fetch(URL_+"/rest/v1/admins?select=user_id",{headers:H()}).then(J).then(function(a){
  $("lg").className="hide";$("app").className="";
  if(a.length){return Promise.all([rpc("admin_overview").then(function(x){return x.json()}),fetch(URL_+"/rest/v1/packages?select=*&order=max_branches",{headers:H()}).then(J)]).then(function(r){DATA=r[0];PK=r[1];show("dash")})}
  $("main").innerHTML='<div class="card"><b>Aap ka account Owner ya Branch Manager ka hai.</b><div class="mut">Naya dashboard abhi ban raha hai. Tab tak purana dashboard istemal karein:</div><a class="btn" style="display:block;text-align:center;text-decoration:none" href="index.html">Dashboard kholen</a></div>';
  $("sb").className="hide";
 }).catch(function(){$("lg").className="lgw";msg("lm","Login nahi ho saka. Dobara koshish karein.")});
}
function reload(){return rpc("admin_overview").then(function(x){return x.json()}).then(function(d){DATA=d;show(V)})}
document.querySelectorAll("#sb a[data-v]").forEach(function(a){a.onclick=function(){show(a.getAttribute("data-v"));$("sb").classList.remove("open")}});
function show(v){
 V=v;document.querySelectorAll("#sb a[data-v]").forEach(function(a){a.classList.toggle("on",a.getAttribute("data-v")==v)});
 $("pt").textContent={dash:"Platform Overview",rest:"Restaurants",pack:"Packages",subs:"Subscriptions",pay:"Payments",aud:"Audit log",soon:"Jald aa raha hai"}[v];
 if(v=="pay"||v=="aud"){loadExtra(v);return}
 $("main").innerHTML=v=="dash"?vDash():v=="rest"?vRest():v=="pack"?vPack():v=="subs"?vSubs():'<div class="card">Ye hissa agle stage mein banega (Packages, Payments aur Audit log).</div>';
}
function vDash(){
 var n=DATA.length,act=DATA.filter(function(c){return c.active}).length,br=0,fb=0;
 DATA.forEach(function(c){br+=c.branches.length;fb+=Number(c.total)});
 var f=n?act/n:0,C=2*Math.PI*40;
 return '<div class="grid"><div class="kp"><b>'+n+'</b><span>Restaurants</span></div><div class="kp"><b>'+act+'</b><span>Active</span></div><div class="kp"><b>'+br+'</b><span>Branches</span></div><div class="kp"><b>'+fb+'</b><span>Total feedback</span></div><div class="kp"><b>'+DATA.filter(function(c){return c.sub_status=="grace"}).length+'</b><span>Grace mein</span></div><div class="kp"><b>'+DATA.filter(function(c){return c.sub_status=="expired"}).length+'</b><span>Expire</span></div></div>'+
 '<div class="card"><b>Account ki halat</b><div class="row" style="gap:20px"><svg viewBox="0 0 100 100" width="130" height="130"><circle cx="50" cy="50" r="40" fill="none" stroke="#fdecea" stroke-width="14"/><circle cx="50" cy="50" r="40" fill="none" stroke="#6d4aff" stroke-width="14" stroke-dasharray="'+(C*f)+' '+C+'" transform="rotate(-90 50 50)"/><text x="50" y="55" text-anchor="middle" font-size="18" font-weight="700">'+Math.round(f*100)+'%</text></svg><div><span class="tag tg-ok">Active '+act+'</span><br><span class="tag tg-bad" style="margin-top:6px;display:inline-block">Band '+(n-act)+'</span></div></div></div>';
}
function opts(a){return a.map(function(x){return '<option>'+esc(x)+'</option>'}).join("")}
function vRest(){
 var h='<div class="card"><b>Naya client banayein</b><div class="g2"><input id="cn" placeholder="Restaurant ka naam"><input id="cs" placeholder="Link ka naam (tea-time)"><input id="ce" type="email" placeholder="Owner ki email"><input id="cp" placeholder="Owner ka password (8+ huroof)"><input id="cb" placeholder="Branches, comma se alag"><select id="cg">'+opts(PK.map(function(p){return p.name}))+'</select><select id="cl"><option value="monthly">Mahana</option><option value="annual">Salana</option></select></div><button class="btn" id="cc">Client banayein</button><div id="cm"></div></div>';
 DATA.forEach(function(c){
  var s=esc(c.slug);
  h+='<div class="card" data-s="'+s+'"><div class="rh"><b>'+esc(c.name)+'</b><span class="tag '+(c.active?"tg-ok":"tg-bad")+'">'+(c.active?"Active":"Band")+'</span><span class="tag tg-n">'+esc(c.package||"Package nahi")+'</span><span class="mut">'+esc(c.sub_status||"")+(c.ends_on?" · "+esc(c.ends_on)+" tak":"")+'</span></div>'+
  '<div class="mut">'+s+' · '+c.total+' feedback</div>'+
  '<div class="mut">Branches '+c.branches.length+' / '+c.max_branches+'</div><div>'+c.branches.map(function(b){return '<span class="chip">'+esc(b.name)+'<i data-a="rb" data-n="'+encodeURIComponent(b.name)+'">✕</i></span>'}).join("")+'</div>'+
  '<div class="row"><input data-i="bn" placeholder="Nayi branch"><button class="sbtn" data-a="ab">Jorein</button></div>'+
  '<div class="mut">Users '+c.users.length+' / '+c.max_users+'</div>'+c.users.map(function(u){return '<div class="mut" style="margin-top:2px">'+esc(u.email)+' · '+esc(u.role)+(u.branch?" · "+esc(u.branch):"")+'</div>'}).join("")+
  '<details><summary>Naya user jorein</summary><div class="g2"><input data-i="ue" type="email" placeholder="Email"><input data-i="up" placeholder="Password (8+)"><select data-i="ur"><option value="owner">Owner</option><option value="manager">Branch Manager</option></select><select data-i="ub"><option value="">Branch (manager ke liye)</option>'+opts(c.branches.map(function(b){return b.name}))+'</select></div><button class="sbtn" data-a="au" style="margin-top:8px">User banayein</button></details>'+
  '<div class="row"><select data-i="pk">'+opts(PK.map(function(p){return p.name}))+'</select><select data-i="bl"><option value="monthly">Mahana</option><option value="annual">Salana</option></select><button class="sbtn" data-a="sp">Package lagayein</button></div>'+
  '<div class="row"><button class="sbtn" data-a="tg" data-v="'+(c.active?0:1)+'">'+(c.active?"Band karein":"Chalu karein")+'</button></div><div data-i="mm"></div></div>';
 });
 return h;
}
function val(card,i){return card.querySelector('[data-i="'+i+'"]').value.trim()}
function slugify(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
$("main").oninput=function(e){if(e.target.id=="cn"&&!$("cs").dataset.m)$("cs").value=slugify(e.target.value);if(e.target.id=="cs")e.target.dataset.m=1};
$("main").onclick=function(e){
 var t=e.target.closest("[data-a],#cc");if(!t)return;
 if(t.id=="cc")return createClient(t);
 var a=t.getAttribute("data-a"),card=t.closest(".card"),s=card.getAttribute("data-s"),mm=card.querySelector('[data-i="mm"]');
 function err(x){mm.innerHTML='<div class="msg er">'+esc(x.message)+'</div>'}
 if(a=="tg"){if(t.getAttribute("data-v")=="0"&&!confirm("Is client ka page aur dashboard band ho jayega. Pakka?"))return;rpc("admin_set_active",{p_slug:s,p_active:t.getAttribute("data-v")=="1"}).then(reload).catch(err)}
 else if(a=="rb"){var n=decodeURIComponent(t.getAttribute("data-n"));if(!confirm(n+" hata dein? Purani feedback mehfooz rahegi."))return;rpc("admin_remove_branch",{p_slug:s,p_name:n}).then(reload).catch(err)}
 else if(a=="ab"){var v=val(card,"bn");if(v)rpc("admin_add_branch",{p_slug:s,p_name:v}).then(reload).catch(err)}
 else if(a=="sp"){rpc("admin_set_package",{p_slug:s,p_package:val(card,"pk"),p_billing:val(card,"bl"),p_days:val(card,"bl")=="annual"?365:30}).then(reload).catch(err)}
 else if(a=="np"||a=="pk"||a=="us"||a=="ex"){return pkSub(a,t,card,s,mm,err)}
 else if(a=="vp"||a=="rj"||a=="rp"){return payAct(a,t,card,mm,err)}
 else if(a=="au"){t.disabled=true;fn(ADD_USER_FN,{slug:s,email:val(card,"ue"),password:val(card,"up"),role:val(card,"ur"),branch:val(card,"ub")}).then(reload).catch(function(x){err(x);t.disabled=false})}
};
function rest(m,p,b){return fetch(URL_+"/rest/v1/"+p,{method:m,headers:Object.assign({"Prefer":"return=minimal"},H()),body:b?JSON.stringify(b):undefined}).then(function(x){if(!x.ok)return x.json().then(function(j){throw new Error(j.message||x.status)});return x})}
function loadPK(){return fetch(URL_+"/rest/v1/packages?select=*&order=max_branches",{headers:H()}).then(J).then(function(p){PK=p;show(V)})}
var PF=["max_branches","max_users","monthly_price","annual_price","extra_branch_price","extra_user_price"],PL=["Branches","Users","Mahana Rs","Salana Rs","Extra branch Rs","Extra user Rs"];
function sel(a,v){return a.map(function(x){return '<option'+(x==v?' selected':'')+'>'+esc(x)+'</option>'}).join("")}
function pnames(){return PK.map(function(p){return p.name})}
function vPack(){
 var def=[1,2,0,0,1500,300];
 var h='<div class="card"><b>Naya package</b><div class="g2"><div><div class="mut">Naam</div><input data-i="name" placeholder="Package ka naam"></div>'+PF.map(function(k,i){return '<div><div class="mut">'+PL[i]+'</div><input type="number" min="0" data-i="'+k+'" value="'+def[i]+'"></div>'}).join("")+'</div><button class="btn" data-a="np">Package banayein</button><div data-i="mm"></div></div>';
 PK.forEach(function(p){h+='<div class="card" data-id="'+esc(p.id)+'"><b>'+esc(p.name)+'</b><div class="g2">'+PF.map(function(k,i){return '<div><div class="mut">'+PL[i]+'</div><input type="number" min="0" data-i="'+k+'" value="'+Number(p[k])+'"></div>'}).join("")+'</div><button class="sbtn" data-a="pk" style="margin-top:8px">Save</button><div data-i="mm"></div></div>'});
 return h;
}
function vSubs(){
 return DATA.map(function(c){
  var ok=c.sub_status=="active"||c.sub_status=="grace";
  return '<div class="card" data-s="'+esc(c.slug)+'"><div class="rh"><b>'+esc(c.name)+'</b><span class="tag '+(ok?"tg-ok":"tg-bad")+'">'+esc(c.sub_status||"subscription nahi")+'</span></div><div class="g2">'+
  '<div><div class="mut">Package</div><select data-i="sp">'+sel(pnames(),c.package)+'</select></div>'+
  '<div><div class="mut">Billing</div><select data-i="sb">'+sel(["monthly","annual"],c.billing)+'</select></div>'+
  '<div><div class="mut">Khatam hone ki tareekh</div><input type="date" data-i="en" value="'+esc(c.ends_on||"")+'"></div>'+
  '<div><div class="mut">Grace ke din</div><input type="number" min="0" data-i="gr" value="'+(c.grace_days==null?7:Number(c.grace_days))+'"></div>'+
  '<div><div class="mut">Extra branches</div><input type="number" min="0" data-i="xb" value="'+Number(c.extra_branches||0)+'"></div>'+
  '<div><div class="mut">Extra users</div><input type="number" min="0" data-i="xu" value="'+Number(c.extra_users||0)+'"></div>'+
  '<div><div class="mut">Status</div><select data-i="st">'+sel(["active","suspended","pending"],(c.sub_status=="grace"||c.sub_status=="expired")?"active":c.sub_status)+'</select></div></div>'+
  '<div class="row"><button class="sbtn" data-a="us">Save</button><button class="sbtn" data-a="ex" data-d="30">+30 din</button><button class="sbtn" data-a="ex" data-d="365">+1 saal</button></div><div data-i="mm"></div></div>';
 }).join("")||'<div class="card">Koi restaurant nahi.</div>';
}
function pkSub(a,t,card,s,mm,err){
 if(a=="np"||a=="pk"){
  var b={};PF.forEach(function(k){b[k]=parseInt(val(card,k),10)||0});
  if(a=="np"){b.name=val(card,"name");if(!b.name)return err(new Error("Package ka naam likhein"));return rest("POST","packages",b).then(loadPK).catch(err)}
  return rest("PATCH","packages?id=eq."+encodeURIComponent(card.getAttribute("data-id")),b).then(loadPK).catch(err);
 }
 if(a=="ex"){
  var d=parseInt(t.getAttribute("data-d"),10),e=val(card,"en"),td=new Date().toISOString().slice(0,10),base=(e&&e>td)?e:td,x=new Date(base+"T00:00:00Z");
  x.setUTCDate(x.getUTCDate()+d);card.querySelector('[data-i="en"]').value=x.toISOString().slice(0,10);card.querySelector('[data-i="st"]').value="active";
 }
 rpc("admin_update_subscription",{p_slug:s,p_package:val(card,"sp"),p_billing:val(card,"sb"),p_status:val(card,"st"),p_ends:val(card,"en")||null,p_grace:parseInt(val(card,"gr"),10)||0,p_xb:parseInt(val(card,"xb"),10)||0,p_xu:parseInt(val(card,"xu"),10)||0}).then(reload).catch(err);
}
function money(x){return "Rs "+Number(x||0).toLocaleString()}
function charge(c){var p=PK.filter(function(x){return x.name==c.package})[0];if(!p)return 0;return (c.billing=="annual"?p.annual_price:p.monthly_price)+(c.extra_branches||0)*p.extra_branch_price+(c.extra_users||0)*p.extra_user_price}
function loadExtra(v){
 $("main").innerHTML='<div class="card">Loading...</div>';
 (v=="pay"?rpc("admin_payments"):rpc("admin_audit",{p_limit:100})).then(function(x){return x.json()}).then(function(d){if(V!=v)return;$("main").innerHTML=v=="pay"?vPay(d):vAud(d)})
 .catch(function(e){$("main").innerHTML='<div class="card"><div class="msg er">'+esc(e.message)+'</div></div>'});
}
function vPay(d){
 var pend=d.filter(function(x){return x.status=="pending"}).length,ver=0;d.forEach(function(x){if(x.status=="verified")ver+=Number(x.amount)});
 var h='<div class="grid"><div class="kp"><b>'+pend+'</b><span>Pending payments</span></div><div class="kp"><b>'+money(ver)+'</b><span>Verified (kul)</span></div></div>';
 h+='<div class="card"><b>Payment darj karein</b><div class="g2"><select data-i="rs">'+DATA.map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'}).join("")+'</select><input type="number" min="0" data-i="am" placeholder="Rakam (Rs)"><select data-i="mt"><option value="bank_transfer">Bank transfer</option><option value="jazzcash_easypaisa">JazzCash / Easypaisa</option><option value="card">Card</option></select><input data-i="rf" placeholder="Transaction reference"><input data-i="nt" placeholder="Note (optional)"></div><button class="btn" data-a="rp">Darj karein (pending)</button><div data-i="mm"></div></div>';
 h+='<div class="card"><b>Subscription ki qeemat</b>'+DATA.map(function(c){return '<div class="mut" style="margin-top:6px"><b>'+esc(c.name)+'</b> · '+esc(c.package||"-")+' ('+esc(c.billing||"-")+') · '+money(charge(c))+' · '+esc(c.sub_status||"")+(c.ends_on?" · "+esc(c.ends_on)+" tak":"")+'</div>'}).join("")+'</div>';
 d.forEach(function(x){var st=x.status;
  h+='<div class="card" data-id="'+esc(x.id)+'"><div class="rh"><b>'+esc(x.name)+'</b><span class="tag '+(st=="verified"?"tg-ok":st=="rejected"?"tg-bad":"tg-n")+'">'+esc(st)+'</span><b>'+money(x.amount)+'</b></div><div class="mut">'+esc(x.method)+' · '+esc(x.reference||"reference nahi")+(x.note?" · "+esc(x.note):"")+'</div><div class="mut">'+new Date(x.submitted_at).toLocaleString()+'</div>'+
  (st=="pending"?'<div class="row"><button class="sbtn" data-a="vp" data-x="1">Verify + subscription barhayen</button><button class="sbtn" data-a="vp" data-x="0">Sirf verify</button><button class="sbtn" data-a="rj">Reject</button></div>':"")+'<div data-i="mm"></div></div>'});
 return h||'<div class="card">Koi payment nahi.</div>';
}
function vAud(d){
 return '<div class="card"><b>Aakhri 100 kaam</b>'+(d.map(function(x){return '<div class="mut" style="margin-top:8px"><b>'+esc(x.action)+'</b> '+esc(x.details&&x.details.name||"")+(x.details&&x.details.status?" ("+esc(x.details.status)+")":"")+'<br>'+new Date(x.at).toLocaleString()+' · '+esc(x.actor||"SQL / system")+'</div>'}).join("")||'<div class="mut">Abhi koi record nahi.</div>')+'</div>';
}
function payAct(a,t,card,mm,err){
 var id=card.getAttribute("data-id");
 if(a=="rp"){
  var rid=val(card,"rs"),amt=parseInt(val(card,"am"),10);
  if(!rid||isNaN(amt)||amt<0)return err(new Error("Restaurant aur sahi rakam likhein"));
  return rest("POST","payments",{restaurant_id:rid,amount:amt,method:val(card,"mt"),reference:val(card,"rf")||null,note:val(card,"nt")||null}).then(function(){loadExtra("pay")}).catch(err);
 }
 if(a=="vp")return rpc("admin_verify_payment",{p_id:id,p_extend:t.getAttribute("data-x")=="1"}).then(reload).catch(err);
 if(a=="rj")return rpc("admin_reject_payment",{p_id:id,p_note:""}).then(function(){loadExtra("pay")}).catch(err);
}
function createClient(b){
 var name=$("cn").value.trim(),slug=$("cs").value.trim(),em=$("ce").value.trim(),pw=$("cp").value,pkn=$("cg").value,bl=$("cl").value;
 var br=$("cb").value.split(",").map(function(x){return x.trim()}).filter(Boolean),p=PK.filter(function(x){return x.name==pkn})[0];
 if(!name||!slug||!em||!br.length)return msg("cm","Naam, link, email aur kam az kam ek branch zaroori hai.");
 if(pw.length<8)return msg("cm","Password kam az kam 8 huroof ka rakhein.");
 if(p&&br.length>p.max_branches)return msg("cm",pkn+" package mein sirf "+p.max_branches+" branch allowed hai.");
 b.disabled=true;$("cm").innerHTML="";
 fn("super-service",{name:name,slug:slug,email:em,password:pw,branches:br,alert_email:"",google_link:""})
 .then(function(){return rpc("admin_set_package",{p_slug:slug,p_package:pkn,p_billing:bl,p_days:bl=="annual"?365:30})})
 .then(reload).then(function(){msg("cm","Client ban gaya: ?r="+slug,true)}).catch(function(x){msg("cm",x.message);b.disabled=false});
}
