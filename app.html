 var r0=d[0],g0=d[1],b0=d[2],seen=new Uint8Array(w*h),st=[];
 function push(px,py){if(px<0||py<0||px>=w||py>=h)return;var k=py*w+px;if(seen[k])return;seen[k]=1;var i=k*4;if(Math.abs(d[i]-r0)+Math.abs(d[i+1]-g0)+Math.abs(d[i+2]-b0)<60)st.push(k)}
 for(var i=0;i<w;i++){push(i,0);push(i,h-1)}
 for(var j=0;j<h;j++){push(0,j);push(w-1,j)}
 while(st.length){var k=st.pop(),px=k%w,py=(k-px)/w;d[k*4+3]=0;push(px+1,py);push(px-1,py);push(px,py+1);push(px,py-1)}

}

   c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
