<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunno – Feedback</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a65;--ac:#0f766e;--bad:#b42318;--ok:#067647;--bd:#e3e1da}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--tx:#f1f0ea;--mu:#a09f98;--ac:#2dd4bf;--bad:#f97066;--ok:#47cd89;--bd:#34332f}}
*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}.s{color:var(--mu);font-size:14px;margin:0 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.stars{display:flex;gap:6px;font-size:38px;margin:8px 0}
.stars span{cursor:pointer;color:var(--bd)}.stars span.on{color:#f5a623}
textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.b{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700}
.b:disabled{opacity:.6}
.msg{padding:12px;border-radius:10px;margin-top:10px;font-size:15px}
.good{background:rgba(6,118,71,.12);color:var(--ok)}.badm{background:rgba(180,35,24,.12);color:var(--bad)}
.k{display:flex;gap:10px}.k div{flex:1;text-align:center}.k b{font-size:24px;display:block}.k span{font-size:12px;color:var(--mu)}
.i{border-top:1px solid var(--bd);padding:10px 0}.i:first-child{border-top:0}
.t{font-size:12px;color:var(--mu)}
.hide{display:none}
</style>
</head>
<body>
<div class="w">
<h1>Sunno</h1>
<p class="s">Aap ki raye hamare liye ahem hai</p>
<div class="tabs"><button id="t1" class="on">Feedback</button><button id="t2">Manager</button></div>

<div id="v1">
<div class="c">
<b>Aap ka experience kaisa raha?</b>
<select id="br"><option>Gulberg Branch</option><option>DHA Branch</option><option>Clifton Branch</option></select>
<div class="stars" id="st"></div>
<textarea id="cm" rows="3" placeholder="Apna comment likhein (optional)"></textarea>
<button class="b" id="go">Submit</button>
<div id="res"></div>
</div>
</div>

<div id="v2" class="hide">
<div class="c k"><div><b id="k1">0</b><span>Responses</span></div><div><b id="k2">0.0</b><span>Avg rating</span></div><div><b id="k3">0</b><span>Buri (3 ya kam)</span></div></div>
<div class="c" id="list">Loading...</div>
</div>
</div>

<script>
var URL_="https://janatzwnpkkktdjtijvg.supabase.co";
var KEY="sb_publishable_c0zs6fe0koMK3koP5lsvhw_et_UnE2a";
var H={"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"};
function $(i){return document.getElementById(i)}
function esc(t){var d=document.createElement("div");d.textContent=t||"";return d.innerHTML}
var rate=0,st=$("st");
var qb=new URLSearchParams(location.search).get("branch");
if(qb){var o=document.createElement("option");o.textContent=qb;$("br").insertBefore(o,$("br").firstChild);$("br").value=qb}
for(var i=1;i<=5;i++){(function(n){var s=document.createElement("span");s.textContent="★";s.onclick=function(){rate=n;paint()};st.appendChild(s)})(i)}
function paint(){[].forEach.call(st.children,function(s,i){s.className=i<rate?"on":""})}
function tab(n){$("v1").className=n==1?"":"hide";$("v2").className=n==2?"":"hide";$("t1").className=n==1?"on":"";$("t2").className=n==2?"on":"";if(n==2)load()}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
$("go").onclick=function(){
 var r=$("res"),b=$("go");
 if(!rate){r.innerHTML='<div class="msg badm">Pehle star rating select karein.</div>';return}
 b.disabled=true;r.innerHTML="";
 fetch(URL_+"/rest/v1/feedback",{method:"POST",headers:Object.assign({"Prefer":"return=minimal"},H),
  body:JSON.stringify({branch:$("br").value,rating:rate,comment:$("cm").value.trim()||null})})
 .then(function(x){
  if(!x.ok)throw new Error(x.status);
  r.innerHTML=rate<=3?'<div class="msg badm">Shukriya. Hume afsos hai, manager aap se rabta karenge.</div>':'<div class="msg good">Shukriya! Aap ki feedback save ho gayi.</div>';
  rate=0;paint();$("cm").value="";
 }).catch(function(){r.innerHTML='<div class="msg badm">Save nahi ho saki. Internet check karke dobara koshish karein.</div>'})
 .then(function(){b.disabled=false});
};
function load(){
 $("list").textContent="Loading...";
 fetch(URL_+"/rest/v1/feedback?select=*&order=created_at.desc&limit=100",{headers:H})
 .then(function(x){if(!x.ok)throw new Error(x.status);return x.json()})
 .then(function(d){
  var n=d.length,sum=0,low=0;d.forEach(function(e){sum+=e.rating;if(e.rating<=3)low++});
  $("k1").textContent=n;$("k2").textContent=n?(sum/n).toFixed(1):"0.0";$("k3").textContent=low;
  var h="";
  d.forEach(function(e){
   h+='<div class="i"><b>'+"★".repeat(e.rating)+'</b><div>'+(esc(e.comment)||'<span class="t">Koi comment nahi</span>')+'</div><div class="t">'+esc(e.branch)+" · "+new Date(e.created_at).toLocaleString()+"</div></div>";
  });
  $("list").innerHTML=h||'<span class="t">Abhi koi feedback nahi.</span>';
 }).catch(function(){$("list").innerHTML='<span class="t">Data load nahi hua.</span>'});
}
</script>
</body>
</html>
