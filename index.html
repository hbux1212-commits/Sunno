<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunno – Feedback</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a65;--ac:#0f766e;--bad:#b42318;--ok:#067647;--bd:#e3e1da}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--tx:#f1f0ea;--mu:#a09f98;--ac:#2dd4bf;--bad:#f97066;--ok:#47cd89;--bd:#34332f}}
*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}.s{color:var(--mu);font-size:14px;margin:0 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.stars{display:flex;gap:6px;font-size:38px;margin:8px 0}
.stars span{cursor:pointer;color:var(--bd)}.stars span.on{color:#f5a623}
textarea,select,input{width:100%;padding:10px;margin-top:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.b{display:block;text-align:center;text-decoration:none;width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700}
.b:disabled{opacity:.6}
.msg{padding:12px;border-radius:10px;margin-top:10px;font-size:15px}
.good{background:rgba(6,118,71,.12);color:var(--ok)}.badm{background:rgba(180,35,24,.12);color:var(--bad)}
.k{display:flex;gap:10px}.k div{flex:1;text-align:center}.k b{font-size:24px;display:block}.k span{font-size:12px;color:var(--mu)}
.f{display:flex;gap:8px}.f select{margin-top:0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 4px;text-align:left;border-top:1px solid var(--bd)}th{font-size:12px;color:var(--mu);border-top:0}
.i{border-top:1px solid var(--bd);padding:10px 0}.i:first-child{border-top:0}
.t{font-size:12px;color:var(--mu)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;margin-left:6px}
.open{background:rgba(180,35,24,.14);color:var(--bad)}.done{background:rgba(6,118,71,.14);color:var(--ok)}
.sm{padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:13px;margin-top:6px}
.hide{display:none}
</style>
</head>
<body>
<div class="w">
<h1 id="brand">Sunno</h1>
<p class="s">Aap ki raye hamare liye ahem hai</p>
<div class="tabs"><button id="t1" class="on">Feedback</button><button id="t2">Manager</button></div>

<div id="v1">
<div class="c">
<b id="q">Aap ka experience kaisa raha?</b>
<select id="br"></select>
<div class="stars" id="st"></div>
<textarea id="cm" rows="3" placeholder="Apna comment likhein (optional)"></textarea>
<button class="b" id="go" disabled>Submit</button>
<div id="res"></div>
</div>
</div>

<div id="v2" class="hide">
<div id="lg" class="c">
<b>Manager login</b>
<input id="em" type="email" placeholder="Email" autocomplete="username">
<input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<button class="b" id="lgb">Login</button>
<div id="lgm"></div>
</div>
<div id="dash" class="hide">
<select id="rs" class="hide"></select>
<div class="c f"><select id="fb"></select><select id="fd"><option value="1">Aaj</option><option value="7">7 din</option><option value="30" selected>30 din</option><option value="0">Sab</option></select></div>
<div class="c k"><div><b id="k1">0</b><span>Responses</span></div><div><b id="k2">0.0</b><span>Avg rating</span></div><div><b id="k3">0</b><span>Open alerts</span></div></div>
<div class="c"><b>Branch-wise</b><table id="bt"></table></div>
<div class="c" id="list">Loading...</div>
<button class="sm" id="out">Logout</button>
</div>
<p class="t" style="text-align:center;margin-top:18px">Powered by Sunno</p>
</div>
</div>

<script>
var URL_="https://janatzwnpkkktdjtijvg.supabase.co";
var KEY="sb_publishable_c0zs6fe0koMK3koP5lsvhw_et_UnE2a";
var P=new URLSearchParams(location.search);
var SLUG=P.get("r")||"brew-house",QB=P.get("branch");
var TOK=null,ALL=[],REST=null,MY=[],CUR=null,BRL=[];
function hdr(auth){return {"apikey":KEY,"Authorization":"Bearer "+((auth&&TOK)?TOK:KEY),"Content-Type":"application/json"}}
function $(i){return document.getElementById(i)}
function esc(t){var d=document.createElement("div");d.textContent=t||"";return d.innerHTML}
function J(x){if(x.status==401&&TOK){TOK=null;show();throw 0}if(!x.ok)throw new Error(x.status);return x.json()}
function gl(u){return /^https:\/\//.test(u||"")?u:""}

/* ---------- Customer ---------- */
var rate=0,st=$("st");
for(var i=1;i<=5;i++){(function(n){var s=document.createElement("span");s.textContent="★";s.onclick=function(){rate=n;paint()};st.appendChild(s)})(i)}
function paint(){[].forEach.call(st.children,function(s,i){s.className=i<rate?"on":""})}
function initCustomer(){
 fetch(URL_+"/rest/v1/restaurants?slug=eq."+encodeURIComponent(SLUG)+"&select=id,slug,name,google_link",{headers:hdr(false)})
 .then(J).then(function(a){
  if(!a.length)throw new Error("none");
  REST=a[0];$("brand").textContent=REST.name;document.title=REST.name+" – Feedback";
  $("q").textContent=REST.name+" mein aap ka experience kaisa raha?";
  return fetch(URL_+"/rest/v1/branches?restaurant_id=eq."+REST.id+"&select=name&order=name",{headers:hdr(false)});
 }).then(J).then(function(b){
  var names=b.map(function(x){return x.name});
  if(QB&&names.indexOf(QB)<0)names.push(QB);
  names.forEach(function(n){var o=document.createElement("option");o.textContent=n;$("br").appendChild(o)});
  if(QB)$("br").value=QB;
  $("go").disabled=false;
 }).catch(function(){$("res").innerHTML='<div class="msg badm">Ye restaurant nahi mila. Link dobara check karein.</div>'});
}
$("go").onclick=function(){
 var r=$("res"),b=$("go"),br=$("br").value,rt=rate;
 if(!rt){r.innerHTML='<div class="msg badm">Pehle star rating select karein.</div>';return}
 b.disabled=true;r.innerHTML="";
 fetch(URL_+"/rest/v1/feedback",{method:"POST",headers:Object.assign({"Prefer":"return=minimal"},hdr(false)),
  body:JSON.stringify({restaurant_id:REST.id,branch:br,rating:rt,comment:$("cm").value.trim()||null})})
 .then(function(x){
  if(!x.ok)throw new Error(x.status);
  if(rt<=3){r.innerHTML='<div class="msg badm">Shukriya. Hume afsos hai, manager aap se rabta karenge.</div>'}
  else{
   var u=gl(REST.google_link);
   r.innerHTML='<div class="msg good">Shukriya! Aap ki feedback save ho gayi.'+(u?' Agar aap ko pasand aaya, to Google par bhi review dein:':'')+'</div>'+(u?'<a class="b" target="_blank" rel="noopener" href="'+u+'">Google par review dein</a>':'');
  }
  rate=0;paint();$("cm").value="";
 }).catch(function(){r.innerHTML='<div class="msg badm">Save nahi ho saki. Internet check karke dobara koshish karein.</div>'})
 .then(function(){b.disabled=false});
};
function tab(n){$("v1").className=n==1?"":"hide";$("v2").className=n==2?"":"hide";$("t1").className=n==1?"on":"";$("t2").className=n==2?"on":"";if(n==2)show()}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};

/* ---------- Manager ---------- */
function show(){
 $("lg").className=TOK?"c hide":"c";
 $("dash").className=TOK?"":"hide";
 if(TOK)loadMine();
}
$("lgb").onclick=function(){
 var b=$("lgb");b.disabled=true;$("lgm").innerHTML="";
 fetch(URL_+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},
  body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})})
 .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
 .then(function(x){if(!x.ok||!x.j.access_token)throw 0;TOK=x.j.access_token;$("pw").value="";show()})
 .catch(function(){$("lgm").innerHTML='<div class="msg badm">Email ya password galat hai.</div>'})
 .then(function(){b.disabled=false});
};
$("out").onclick=function(){TOK=null;ALL=[];MY=[];CUR=null;show()};
$("fb").onchange=render;$("fd").onchange=render;
$("rs").onchange=function(){CUR=$("rs").value;$("fb").value="";load()};

function loadMine(){
 $("list").textContent="Loading...";
 fetch(URL_+"/rest/v1/restaurant_users?select=restaurant_id",{headers:hdr(true)}).then(J).then(function(a){
  var ids=a.map(function(x){return x.restaurant_id});
  if(!ids.length){$("list").innerHTML='<span class="t">Is account ko abhi koi restaurant assign nahi hui.</span>';return null}
  return fetch(URL_+"/rest/v1/restaurants?id=in.("+ids.join(",")+")&select=id,slug,name&order=name",{headers:hdr(true)}).then(J);
 }).then(function(rs){
  if(!rs)return;
  MY=rs;if(!CUR||!rs.some(function(x){return x.id==CUR}))CUR=rs[0].id;
  var h="";rs.forEach(function(x){h+='<option value="'+x.id+'">'+esc(x.name)+'</option>'});
  $("rs").innerHTML=h;$("rs").value=CUR;$("rs").className=rs.length>1?"":"hide";
  load();
 }).catch(function(e){if(e!==0)$("list").innerHTML='<span class="t">Data load nahi hua.</span>'});
}
function load(){
 $("list").textContent="Loading...";
 Promise.all([
  fetch(URL_+"/rest/v1/branches?restaurant_id=eq."+CUR+"&select=name&order=name",{headers:hdr(true)}).then(J),
  fetch(URL_+"/rest/v1/feedback?restaurant_id=eq."+CUR+"&select=*&order=created_at.desc&limit=1000",{headers:hdr(true)}).then(J)
 ]).then(function(r){
  BRL=r[0].map(function(x){return x.name});ALL=r[1];fillBranches();render();
 }).catch(function(e){if(e!==0)$("list").innerHTML='<span class="t">Data load nahi hua.</span>'});
}
function fillBranches(){
 var cur=$("fb").value||"",names=BRL.slice();
 ALL.forEach(function(e){if(names.indexOf(e.branch)<0)names.push(e.branch)});
 var h='<option value="">Sab branches</option>';
 names.forEach(function(n){h+='<option>'+esc(n)+'</option>'});
 $("fb").innerHTML=h;$("fb").value=cur;
}
function render(){
 var days=parseInt($("fd").value,10),br=$("fb").value,from=0;
 if(days==1){var t=new Date();t.setHours(0,0,0,0);from=t.getTime()}
 else if(days>1){from=Date.now()-days*86400000}
 var byDate=ALL.filter(function(e){return new Date(e.created_at).getTime()>=from});
 var d=byDate.filter(function(e){return !br||e.branch==br});
 var n=d.length,sum=0,o=0;d.forEach(function(e){sum+=e.rating;if(e.rating<=3&&!e.resolved)o++});
 $("k1").textContent=n;$("k2").textContent=n?(sum/n).toFixed(1):"0.0";$("k3").textContent=o;
 var m={};byDate.forEach(function(e){var x=m[e.branch]||(m[e.branch]={n:0,s:0,o:0});x.n++;x.s+=e.rating;if(e.rating<=3&&!e.resolved)x.o++});
 var th='<tr><th>Branch</th><th>Total</th><th>Avg</th><th>Alerts</th></tr>';
 Object.keys(m).sort().forEach(function(k){th+='<tr><td>'+esc(k)+'</td><td>'+m[k].n+'</td><td>'+(m[k].s/m[k].n).toFixed(1)+'</td><td>'+m[k].o+'</td></tr>'});
 $("bt").innerHTML=Object.keys(m).length?th:'<tr><td class="t">Is muddat mein koi feedback nahi.</td></tr>';
 var h="";
 d.forEach(function(e){
  var low=e.rating<=3;
  h+='<div class="i"><b>'+"★".repeat(e.rating)+'</b>'+(low?'<span class="tag '+(e.resolved?"done":"open")+'">'+(e.resolved?"Resolved":"Alert")+'</span>':"")+
  '<div>'+(esc(e.comment)||'<span class="t">Koi comment nahi</span>')+'</div><div class="t">'+esc(e.branch)+" · "+new Date(e.created_at).toLocaleString()+"</div>"+
  (low&&!e.resolved?'<button class="sm" data-id="'+e.id+'">Resolved mark karein</button>':"")+"</div>";
 });
 $("list").innerHTML=h||'<span class="t">Is filter mein koi feedback nahi.</span>';
}
$("list").onclick=function(e){
 var id=e.target.getAttribute("data-id");if(!id)return;
 e.target.disabled=true;
 fetch(URL_+"/rest/v1/feedback?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:Object.assign({"Prefer":"return=minimal"},hdr(true)),body:JSON.stringify({resolved:true})})
 .then(function(x){if(!x.ok)throw 0;load()}).catch(function(){e.target.disabled=false});
};
initCustomer();
</script>
</body>
</html>
